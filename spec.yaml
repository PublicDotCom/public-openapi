        '400':
          description: Order validation failed.
  /userapigateway/trading/{accountId}/order/{orderId}:
    get:
      tags:
        - order-placement
      summary: Retrieve order details
      description: |
        Fetches the status and details of a specific order for the given account.
        Works only for orders created within last 30 days.
      operationId: get-order
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrderV2'
        '404':
          description: Order not found.
    delete:
      tags:
        - order-placement
      summary: Request order cancellation
      description: |
        Submits an asynchronous request to cancel the specified order.

        Note: While most cancellations are processed immediately during market hours, this is not guaranteed.
        Always use the GET /{orderId} endpoint to confirm whether the order has been cancelled.
      operationId: cancel-order
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation request submitted successfully.

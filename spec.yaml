          format: int32
        outcomes:
          type: array
          description: the outcomes of the event that consists of YES/NO event contracts. Might be filtered.
          items:
            $ref: '#/components/schemas/com.hellopublic.holdingsystem.eventcontractservice.api.dto.response.apigateway.EventOutcomeApiGatewayDto'
      description: This is called a "Prediction Event" in the Apex structured API.
    Bar:
      type: object

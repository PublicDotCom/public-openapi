components:
  schemas:
    com.hellopublic.userapiauthservice.domain.error.ErrorBody:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
    com.hellopublic.userapiauthservice.api.personal.CreateAccessTokenRequest:
      required:
        - secret
      type: object
      properties:
        validityInMinutes:
          maximum: 1440
          minimum: 5
          type: integer
          description: Validity of the access token to be issued in minutes. Defaults to 15 minutes.
          format: int32
          nullable: true
        secret:
          maxLength: 2147483647
          minLength: 5
          type: string
          description: A valid personal secret
    com.hellopublic.userapiauthservice.api.personal.CreateAccessTokenResponse:
      required:
        - accessToken
      type: object
      properties:
        accessToken:
          type: string
    com.hellopublic.userapigateway.api.rest.order.ApiCancelReplaceOrderRequest:
      required:
        - expiration
        - orderId
        - orderType
        - requestId
      type: object
      properties:
        orderId:
          type: string
          description: |-
            This value identifies the order to be replaced; if reused on the same account, the operation is idempotent.
            If the order is re-submitted due to a read timeout, do not modify any properties. If the original request
            succeeded, altering fields will have no effect.
          format: uuid
        requestId:
          type: string
          description: |-
            Id of the new order in UUID-format conforming to RFC 4122 (standard 8-4-4-4-12 format, e.g., 0d2abd8d-3625-4c83-a806-98abf35567cc).
            The new orderId must be globally unique over time.
          format: uuid
        orderType:
          type: string
          description: The Type of order
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        quantity:
          type: string
          description: |-
            The order quantity. Used when buying/selling whole shares and when selling fractional.
            Mutually exclusive with `amount`
        amount:
          type: string
          description: |-
            The order amount.
            Used when replacing an order for a specific notional value.
            Mutually exclusive with `quantity`
        limitPrice:
          type: string
          description: The limit price. Used when orderType = LIMIT or orderType = STOP_LIMIT
        stopPrice:
          type: string
          description: The stop price. Used when orderType = STOP or orderType = STOP_LIMIT
      description: |-
        Used for replacing orders placed via the UserApiGatewayService or other service
        Replaces should not be placed in parallel as ordering is not guaranteed for individual HTTP calls
    com.hellopublic.userapigateway.api.rest.order.OrderExpiration:
      required:
        - timeInForce
      type: object
      properties:
        timeInForce:
          type: string
          description: The time in for the order
          enum:
            - DAY
            - GTD
        expirationTime:
          type: string
          description: The expiration date. Only used when timeInForce is GTD, cannot be more than 90 days in the future
          format: date-time
    com.hellopublic.userapigateway.api.rest.order.ApiOrderResult:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
    com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument:
      required:
        - symbol
        - type
      type: object
      properties:
        symbol:
          type: string
        type:
          type: string
          enum:
            - EQUITY
            - OPTION
            - MULTI_LEG_INSTRUMENT
            - CRYPTO
            - ALT
            - TREASURY
            - BOND
            - INDEX
            - EVENTCONTRACT
    com.hellopublic.userapigateway.api.rest.order.GatewayTaxLotMatchingInstruction:
      required:
        - quantity
        - taxLotId
      type: object
      properties:
        taxLotId:
          type: string
          description: 'The tax lot id in the format: symbol;tradeDate;price;quantity (e.g., "AAPL;2024-01-15;150.00;10")'
        quantity:
          type: string
          description: The quantity of the equity. Must be greater than 0 and not exceed the quantity of the tax lot.
      description: |-
        Tax lot matching instruction for an order.

        Tax lot matching instructions must follow these rules:
        - There can only be at most 8 tax lot matching instructions per request. If the list of tax lot instructions is present (non-null), it must have at least one and at most eight elements.
        - Tax lot instructions can only be specified for orders to SELL equity with open/close indicator CLOSE.
        - The tax lot instructions must be for the same symbol as this order sells.
        - Tax lot instructions can only be specified for MARKET orders or good for the day LIMIT orders.
        - The total quantity of the tax lot instructions must sum to the quantity of this order.
        - Tax lot instructions can only be specified if the tax lot information has been updated today.

        There is no guarantee that the tax lot instructions are applied exactly as specified.
    com.hellopublic.userapigateway.api.rest.preflight.PreflightSingleLegRequest:
      required:
        - expiration
        - instrument
        - orderSide
        - orderType
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        orderSide:
          type: string
          description: The Order Side BUY/SELL. For Options also include the openCloseIndicator
          enum:
            - BUY
            - SELL
        orderType:
          type: string
          description: The Type of order
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        quantity:
          type: string
          description: |-
            The order quantity. Used when buying/selling whole shares and when selling fractional.
            Mutually exclusive with `amount`
        amount:
          type: string
          description: The order amount. Used when buying/selling shares for a specific notional value
        limitPrice:
          type: string
          description: The limit price. Used when orderType = LIMIT or orderType = STOP_LIMIT
        stopPrice:
          type: string
          description: The stop price. Used when orderType = STOP or orderType = STOP_LIMIT
        equityMarketSession:
          type: string
          description: |-
            The market session in which the order may execute.
            Extended hours are available only for DAY time-in-force equity orders and can execute any time from 4:00 a.m. ET through 8:00 p.m. ET.
            If omitted, the session defaults to CORE.
          enum:
            - CORE
            - EXTENDED
            - TWENTY_FOUR_HOURS
        openCloseIndicator:
          type: string
          description: Used for options to indicate if this is BUY to OPEN/CLOSE. Also used for shorting equities to indicate SELL-to-OPEN (opening a short position) or BUY-to-CLOSE (closing a short position).
          enum:
            - OPEN
            - CLOSE
        validateOrder:
          type: boolean
          description: If true, the order will be validated against current account state. Defaults to true.
        useMargin:
          type: boolean
          description: |-
            If false, the order will be evaluated using cash-only buying power instead of margin buying power when available.
            If true or omitted, margin will be applied when allowed by the account configuration.
            This parameter only has an effect when validateOrder is true and the account has margin enabled.
        taxLotMatchingInstructions:
          type: array
          description: Tax lot matching instructions for this order. See the GatewayTaxLotMatchingInstruction type for detailed rules and constraints.
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayTaxLotMatchingInstruction'
    com.hellopublic.userapigateway.api.rest.order.GatewayShortSelling:
      required:
        - availability
        - uptickRule
      type: object
      properties:
        availability:
          type: string
          description: the availability of short-selling for this instrument.
          enum:
            - NOT_SHORTABLE
            - EASY_TO_BORROW
            - HARD_TO_BORROW
        hardToBorrowPercentageRate:
          type: string
          description: the hard to borrow rate as a percentage value.
        initialMarginRequirementPercentage:
          type: string
          description: the initial margin requirement as a percentage value.
        maintenanceMarginRequirementPercentage:
          type: string
          description: the maintenance margin requirement as a percentage value.
        maxQuantityForLocate:
          type: integer
          description: the maximum quantity that we can request to locate for all hard-to-borrow stocks. The actual number we can locate can be lower for concrete stocks.
          format: int32
        uptickRule:
          type: string
          description: the Uptick Rule is triggered for equities when the price today or yesterday has dropped at least 10 percent since previous days' closing price.
          enum:
            - TRIGGERED
            - NOT_TRIGGERED
      description: Short-selling information for the given instrument.
    com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginImpact:
      type: object
      properties:
        marginUsageImpact:
          type: string
        initialMarginRequirement:
          type: string
    com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginRequirement:
      type: object
      properties:
        longMaintenanceRequirement:
          type: string
        longInitialRequirement:
          type: string
    com.hellopublic.userapigateway.api.rest.preflight.GatewayOptionDetails:
      required:
        - baseSymbol
        - optionExpireDate
        - strikePrice
        - type
      type: object
      properties:
        baseSymbol:
          type: string
        type:
          type: string
          enum:
            - CALL
            - PUT
        strikePrice:
          type: string
        optionExpireDate:
          type: string
          format: date
    com.hellopublic.userapigateway.api.rest.preflight.GatewayOptionRebate:
      type: object
      properties:
        estimatedOptionRebate:
          type: string
        optionRebatePercent:
          type: integer
          format: int32
        perContractRebate:
          type: string
    com.hellopublic.userapigateway.api.rest.preflight.GatewayPriceIncrement:
      type: object
      properties:
        incrementBelow3:
          type: string
        incrementAbove3:
          type: string
        currentIncrement:
          type: string
      description: Price increment information for option orders.
    com.hellopublic.userapigateway.api.rest.preflight.GatewayRegulatoryFees:
      type: object
      properties:
        secFee:
          type: string
        tafFee:
          type: string
        orfFee:
          type: string
        exchangeFee:
          type: string
        occFee:
          type: string
        catFee:
          type: string
      description: |-
        # GatewayRegulatoryFees
        Represents various regulatory fees associated with trading orders.
        <br/>
        ## Fields
        - **secFee** - The SEC charges a regulatory fee for sell orders that execute. The fee is based on the dollar amount of the order.
        - **tafFee** - The Trading Activity Fee is a FINRA fee. The fee is based on the order quantity.
        - **orfFee** - The Options Regulatory Fee (ORF). This is the combined exchange fee rate for all exchanges. Changes monthly.
        - **exchangeFee** - The exchange charges a fee for executing orders for index options.
        - **occFee** - The Options Clearing Corporation Fee (OCC)
        - **catFee** - The Consolidated Audit Trail Fee (CAT)
    com.hellopublic.userapigateway.api.rest.preflight.PreflightSingleLegResponse:
      required:
        - instrument
        - orderValue
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        cusip:
          type: string
        rootSymbol:
          type: string
        rootOptionSymbol:
          type: string
        estimatedCommission:
          type: string
        regulatoryFees:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayRegulatoryFees'
        estimatedIndexOptionFee:
          type: string
        estimatedExecutionFee:
          type: string
        orderValue:
          type: string
        estimatedQuantity:
          type: string
        estimatedCost:
          type: string
        buyingPowerRequirement:
          type: string
        estimatedProceeds:
          type: string
        optionDetails:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayOptionDetails'
        estimatedOrderRebate:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayOptionRebate'
        marginRequirement:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginRequirement'
        marginImpact:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginImpact'
        shortSelling:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayShortSelling'
        priceIncrement:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayPriceIncrement'
      description: |-
        # PreflightSingleLegResponse
        Response containing estimated costs, fees, and other information needed before placing a single-leg order.

        ## Fields

        ### Instrument Information
        - **symbol** - The trading symbol for the instrument
        - **cusip** - The CUSIP identifier for the instrument (if applicable)
        - **securityType** - The type of security (EQUITY, OPTION, BOND, etc.)
        - **rootSymbol** - The root symbol for options and other derivatives
        - **rootOptionSymbol** - The root option symbol for option chains

        ### Cost and Fee Information
        - **estimatedCommission** - The estimated commission amount that will be charged if the order executes
        - **regulatoryFees** - The estimated gateway regulatory fees breakdown including SEC, TAF, ORF, OCC, CAT fees
        - **estimatedIndexOptionFee** - The estimated gateway fee when buying index options
        - **estimatedExecutionFee** - The estimated gateway fee when using specific venues for buying stocks
        - **estimatedCost** - The total estimated cost including all fees and commissions
        - **buyingPowerRequirement** - The buying power required for this order

        ### Order Details
        - **orderValue** - The estimated order value, excluding fees and commission
        - **estimatedQuantity** - For quantity orders this is exact, for amount-based orders this is an estimate
        - **estimatedProceeds** - The estimated proceeds from the order (for sell orders)

        ### Option-Specific Information
        - **optionDetails** - Consolidated option-specific details including strike price, expiration, rebates, and fees
        - **priceIncrement** - Price increment information for option orders

        ### Shorting-Specific Information
        - **shortSelling** - Information about short selling rules and fees
    com.hellopublic.userapigateway.api.rest.order.GatewayLegInstrument:
      required:
        - symbol
        - type
      type: object
      properties:
        symbol:
          type: string
        type:
          type: string
          enum:
            - EQUITY
            - OPTION
    com.hellopublic.userapigateway.api.rest.order.GatewayOrderLeg:
      required:
        - instrument
        - side
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayLegInstrument'
        side:
          type: string
          enum:
            - BUY
            - SELL
        openCloseIndicator:
          type: string
          description: required when instrument.type = OPTION, used to determine if the leg is buy-to-open or buy-to-close
          enum:
            - OPEN
            - CLOSE
        ratioQuantity:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          description: The ratio between legs. Equity legs will typically be 100 shares, and option legs 1 contract
          format: int32
      description: Option or equity leg. There can never be more than 1 equity leg.
    com.hellopublic.userapigateway.api.rest.preflight.PreflightMultiLegRequest:
      required:
        - expiration
        - legs
        - limitPrice
        - orderType
        - quantity
      type: object
      properties:
        orderType:
          type: string
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        quantity:
          type: string
        limitPrice:
          type: string
        legs:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderLeg'
        validateOrder:
          type: boolean
        useMargin:
          type: boolean
      description: |-
        # PreflightMultiLegRequest
        Request for preflight calculations on multi-leg orders.

        ## Fields
        - **orderType** - The type of order (only LIMIT orders are allowed for multi-leg)
        - **expiration** - The order expiration configuration
        - **quantity** - The order quantity (number of strategies)
        - **limitPrice** - The limit price for the order (required for LIMIT orders)
        - **legs** - List of order legs (2-6 legs allowed, at most 1 equity leg)
        - **equityMarketSession** - The market session for equity legs
        - **validateOrder** - If true, the order will be validated against current account state. Defaults to true.
        - **useMargin** - If false, the order will be evaluated using cash-only buying power instead of margin buying power when available. This parameter only has an effect when validateOrder is true and the account has margin enabled. Defaults to true.
    com.hellopublic.userapigateway.api.rest.preflight.PreflightLegResponse:
      required:
        - instrument
        - ratioQuantity
        - side
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        side:
          type: string
          enum:
            - BUY
            - SELL
        openCloseIndicator:
          type: string
          enum:
            - OPEN
            - CLOSE
        ratioQuantity:
          type: integer
          format: int32
        optionDetails:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayOptionDetails'
      description: |-
        # PreflightLegResponse
        Response containing information about an individual leg in a multi-leg order preflight calculation.

        ## Fields

        ### Instrument Information
        - **instrument** - The trading instrument for this leg
        - **side** - The order side (BUY/SELL) for this leg
        - **openCloseIndicator** - Position effect for option legs (BUY_TO_OPEN, BUY_TO_CLOSE, etc.)
        - **ratioQuantity** - The ratio quantity for this leg in the strategy

        ### Cost and Fee Information
        - **estimatedCommission** - The estimated commission for this specific leg
        - **estimatedCost** - The estimated cost for this leg including fees
        - **estimatedProceeds** - The estimated proceeds for this leg (for sell legs)

        ### Option-Specific Information
        - **optionDetails** - Option-specific details like strike price, expiration, fees, and rebates
    com.hellopublic.userapigateway.api.rest.preflight.PreflightMultiLegResponse:
      required:
        - baseSymbol
        - legs
        - orderValue
      type: object
      properties:
        baseSymbol:
          type: string
        strategyName:
          type: string
        legs:
          type: array
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.PreflightLegResponse'
        estimatedCommission:
          type: string
        regulatoryFees:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayRegulatoryFees'
        estimatedIndexOptionFee:
          type: string
        orderValue:
          type: string
        estimatedQuantity:
          type: string
        estimatedCost:
          type: string
        buyingPowerRequirement:
          type: string
        estimatedProceeds:
          type: string
        marginRequirement:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginRequirement'
        marginImpact:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayMarginImpact'
        priceIncrement:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.GatewayPriceIncrement'
      description: |-
        # PreflightMultiLegResponse
        Response containing estimated costs, fees, and other information needed before placing a multi-leg order.

        ## Fields

        ### Strategy Information
        - **baseSymbol** - The base symbol for the multi-leg strategy (e.g., "TSLA" for Tesla options)
        - **strategyName** - The name of the strategy (e.g., "Call Spread", "Iron Condor")
        - **legs** - List of individual leg details for the strategy

        ### Cost and Fee Information
        - **estimatedCommission** - The estimated commission amount that will be charged if the order executes
        - **regulatoryFees** - Gateway regulatory fees breakdown including SEC, TAF, ORF, OCC, CAT fees
        - **estimatedIndexOptionFee** - Estimated index option fees (if applicable)
        - **estimatedCost** - The total estimated cost including all fees and commissions
        - **buyingPowerRequirement** - The buying power required for this multi-leg order

        ### Order Details
        - **orderValue** - The estimated order value, excluding fees and commission
        - **estimatedQuantity** - The number of strategies that will be executed
        - **estimatedProceeds** - The estimated proceeds from the order (for credit spreads)

        ### Option-Specific Information
        - **marginRequirement** - Margin requirements for the multi-leg strategy
        - **marginImpact** - Impact on account margin usage
        - **priceIncrement** - Price increment information for option orders
    com.hellopublic.userapigateway.api.rest.order.ApiOrderRequest:
      required:
        - expiration
        - instrument
        - orderId
        - orderSide
        - orderType
      type: object
      properties:
        orderId:
          type: string
          description: |-
            The OrderId, a UUID conforming to RFC 4122 (standard 8-4-4-4-12 format, e.g., 0d2abd8d-3625-4c83-a806-98abf35567cc),
            must be globally unique over time.
            This value serves as the deduplication key; if reused on the same account, the operation is idempotent.
            If the order is re-submitted due to a read timeout, do not modify any properties. If the original request
            succeeded, altering fields will have no effect.
          format: uuid
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        orderSide:
          type: string
          description: The Order Side BUY/SELL. For Options also include the openCloseIndicator
          enum:
            - BUY
            - SELL
        orderType:
          type: string
          description: The Type of order
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        quantity:
          type: string
          description: |-
            The order quantity. Used when buying/selling whole shares and when selling fractional.
            Mutually exclusive with `amount`
        amount:
          type: string
          description: The order amount. Used when buying/selling shares for a specific notional value
        limitPrice:
          type: string
          description: The limit price. Used when orderType = LIMIT or orderType = STOP_LIMIT
        stopPrice:
          type: string
          description: The stop price. Used when orderType = STOP or orderType = STOP_LIMIT
        equityMarketSession:
          type: string
          description: |-
            The market session in which the order may execute.
            Extended hours are available only for DAY time-in-force equity orders and can execute any time from 4:00 a.m. ET through 8:00 p.m. ET.
            If omitted, the session defaults to CORE.
          enum:
            - CORE
            - EXTENDED
            - TWENTY_FOUR_HOURS
        openCloseIndicator:
          type: string
          description: |-
            Used for options to indicate if this is BUY to OPEN/CLOSE. Also used for shorting equities to indicate SELL-to-OPEN (opening a short position) or BUY-to-CLOSE (closing a short position).
            If null the default will be OPEN for buy orders and CLOSE for sell orders.
          enum:
            - OPEN
            - CLOSE
        useMargin:
          type: boolean
          description: |-
            If false, the order will be evaluated using cash-only buying power instead of margin buying power when available.
            If true or omitted, margin will be applied when allowed by the account configuration.
        taxLotMatchingInstructions:
          type: array
          description: Tax lot matching instructions for this order. See the GatewayTaxLotMatchingInstruction type for detailed rules and constraints.
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayTaxLotMatchingInstruction'
        orderClass:
          type: string
          description: |-
            The order class. Omitted or SIMPLE places a standalone order. BRACKET, OCO, or OTO place a bracket order
            using `takeProfit` and `stopLoss`. Bracket orders are supported for equities and options only, require a
            whole-share `quantity` (no `amount`), must use the CORE market session, and the entry order type must be
            LIMIT or MARKET (LIMIT only for OCO).
          enum:
            - SIMPLE
            - BRACKET
            - OCO
            - OTO
        takeProfit:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayTakeProfit'
        stopLoss:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayStopLoss'
      description: Used for orders placed via the UserApiGatewayService or other service where the order is just a single request and the orderId is generated by the client
    com.hellopublic.userapigateway.api.rest.order.GatewayStopLoss:
      required:
        - stopPrice
      type: object
      properties:
        stopPrice:
          type: string
          description: the stop price that activates the stop-loss order
        limitPrice:
          type: string
          description: optional limit price; when present the stop-loss is placed as a STOP_LIMIT order
      description: |-
        The stop-loss leg of a bracket order. Placed as a STOP order when only `stopPrice` is present, or as a
        STOP_LIMIT order when `limitPrice` is also present.
    com.hellopublic.userapigateway.api.rest.order.GatewayTakeProfit:
      required:
        - limitPrice
      type: object
      properties:
        limitPrice:
          type: string
          description: the limit price at which the take-profit order executes
      description: The take-profit leg of a bracket order. Always placed as a LIMIT order on the opposite side of the entry.
    com.hellopublic.userapigateway.api.rest.order.ApiQueryOrdersRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - NEW
            - PARTIALLY_FILLED
            - CANCELLED
            - QUEUED_CANCELLED
            - FILLED
            - REJECTED
            - PENDING_REPLACE
            - PENDING_CANCEL
            - EXPIRED
            - REPLACED
        createdAfter:
          type: string
          format: date-time
        createdBefore:
          type: string
          format: date-time
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        side:
          type: string
          enum:
            - BUY
            - SELL
        openCloseIndicator:
          type: string
          enum:
            - OPEN
            - CLOSE
        securityType:
          type: string
          enum:
            - EQUITY
            - OPTION
            - MULTI_LEG_INSTRUMENT
            - CRYPTO
            - ALT
            - TREASURY
            - BOND
            - INDEX
            - EVENTCONTRACT
    com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrderV2:
      type: object
      properties:
        orderId:
          type: string
        bracketId:
          type: string
          description: Identifies the bracket this order belongs to, which is the orderId of the bracket's entry (parent) order. All legs of the same bracket share this id. Null for standalone (non-bracket) orders.
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        createdAt:
          type: string
          description: Creation time of the order
          format: date-time
        type:
          type: string
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        side:
          type: string
          enum:
            - BUY
            - SELL
        status:
          type: string
          enum:
            - NEW
            - PARTIALLY_FILLED
            - CANCELLED
            - QUEUED_CANCELLED
            - FILLED
            - REJECTED
            - PENDING_REPLACE
            - PENDING_CANCEL
            - EXPIRED
            - REPLACED
        quantity:
          type: string
          description: Quantity of the order, mutually exclusive with notional value
        notionalValue:
          type: string
          description: Notional value (dollar amount) of the order, mutually exclusive with quantity
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        limitPrice:
          type: string
          description: Present if type = LIMIT
        stopPrice:
          type: string
          description: Present if type = STOP
        closedAt:
          type: string
          description: The time the order reached a terminal state, like CANCELLED, FILLED, REJECTED, REPLACED
          format: date-time
        openCloseIndicator:
          type: string
          description: Present if the order is a single-leg option order, or if the order is a shorting order (sell-to-open or buy-to-close)
          enum:
            - OPEN
            - CLOSE
        filledQuantity:
          type: string
          description: The filled quantity of the order, present if the order had at least one trade
        averagePrice:
          type: string
          description: The average price per unit, present if the order had at least one trade
        legs:
          type: array
          description: If instrument.type = MULTI_LEG_INSTRUMENT, this contains the list of legs
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderLeg'
        equityMarketSession:
          type: string
          description: For equity orders - which market session was chosen
          enum:
            - REGULAR
            - REST_OF_DAY
            - TWENTY_FOUR_HOURS
        filledAt:
          type: string
          description: The time the order was filled
          format: date-time
        replacedAt:
          type: string
          description: The time the order was replaced
          format: date-time
        lastModified:
          type: string
          description: The time the order was last modified
          format: date-time
        trades:
          type: array
          description: The list of trades associated with the order
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.v2.GatewayTrade'
        rejectReason:
          type: string
    com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrders:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrderV2'
    com.hellopublic.userapigateway.api.rest.order.v2.GatewayTrade:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        quantity:
          type: string
        price:
          type: string
        side:
          type: string
          enum:
            - BUY
            - SELL
        tradeId:
          type: string
        timestamp:
          type: string
          format: date-time
    com.hellopublic.userapigateway.api.rest.order.ApiMultilegOrderRequest:
      required:
        - expiration
        - legs
        - limitPrice
        - orderId
        - quantity
        - type
      type: object
      properties:
        orderId:
          type: string
          description: The OrderId, a UUID conforming to RFC 4122 (8-4-4-4-12 format, e.g., 0d2abd8d-3625-4c83-a806-98abf35567cc), globally unique over time. Serves as the deduplication key; if reused on the same account, the operation is idempotent.
          format: uuid
        quantity:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          description: The order quantity
          format: int32
        type:
          type: string
          description: The order type. Only LIMIT order are allowed
          enum:
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
        limitPrice:
          type: string
          description: The limit price for the order. For debit spreads the limit price must be positive, for create spreads the limit price is negative
        expiration:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.OrderExpiration'
        legs:
          minItems: 1
          type: array
          description: From 2-6 legs. There can be at most 1 equity leg
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderLeg'
        useMargin:
          type: boolean
          description: Optional field to indicate whether to use margin buying power. Defaults to true if not specified.
      description: Used for multileg orders placed via the UserApiGatewayService or other service where the order is just a single request and the orderId is generated by the client
    com.matadorapp.shared.customerordergateway.dto.OrderLeg:
      required:
        - ratioQuantity
        - side
        - symbol
      type: object
      properties:
        symbol:
          minLength: 1
          type: string
          description: Symbol for the leg.
        side:
          type: string
          description: Side for the leg.
          enum:
            - BUY
            - SELL
        openCloseIndicator:
          type: string
          description: Position effect for the leg. Will be null for equity leg.
          enum:
            - OPEN
            - CLOSE
        ratioQuantity:
          type: integer
          description: Ratio quantity for the leg.
          format: int32
      description: Leg definition for the strategy.
    com.matadorapp.shared.customerordergateway.dto.StrategyQuoteRequest:
      required:
        - baseSymbol
        - optionLegs
      type: object
      properties:
        baseSymbol:
          minLength: 1
          type: string
          description: Base symbol for the strategy
        optionLegs:
          type: array
          description: Option legs for the order.
          items:
            $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.OrderLeg'
        equityLeg:
          $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.OrderLeg'
      description: Request quote for a multi leg strategy.
    com.hellopublic.trading.core.quote.BondQuoteDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/com.hellopublic.trading.core.quote.QuoteSpecificDetail'
        - type: object
          properties:
            askMinSize:
              type: string
            bidMinSize:
              type: string
            askMarkup:
              type: string
            bidMarkup:
              type: string
    com.hellopublic.trading.core.quote.QuoteSpecificDetail:
      required:
        - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
    com.hellopublic.trading.core.quote.SignedQuote:
      required:
        - signature
        - symbol
        - timestamp
      type: object
      properties:
        symbol:
          minLength: 1
          type: string
          description: The symbol identifying the instrument.
        last:
          type: string
          description: The last trade for this instrument. May be <code>null</code> if the quote is for a symbol on the IPO date and the order type is LIMIT.
        bid:
          type: string
          description: The last bid price for this instrument.
        bidSize:
          type: string
          description: The number of units available at the given bid price.
        ask:
          type: string
          description: The last ask price for this instrument.
        askSize:
          type: string
          description: The number of units available at the given ask price.
        timestamp:
          type: string
          description: The timestamp were the server returned this message. This is not the timestamp of the bid/ask or the last trade
          format: date-time
        signature:
          minLength: 1
          type: string
          description: A hash of the properties, to make sure the app does not change any of the data when posting back the quote during order creation.
        collarPercentage:
          type: string
          description: the collar percentage, used to calculate the markup/markdown for bid/ask which the app should use when placing extended hours limit orders
        buyCollar:
          type: string
          description: Price used to buy with collar. This is collarPercentage higher than the current bid, to ensure that the order will execute unless the market moves more than collarPercentage up
        sellCollar:
          type: string
          description: Price used to sell with collar. This is collarPercentage lower than the current ask, to ensure that the order will execute unless the market moves more than collarPercentage down
        openInterest:
          type: integer
          description: |-
            The total number of options contracts that are not closed or delivered on a particular day.
             This will be null for non option quotes
          format: int32
        bidCollar:
          type: string
          deprecated: true
        askCollar:
          type: string
          deprecated: true
        detail:
          description: Additional quote specific details, for example Bonds have additional quote specific properties such as markup
          oneOf:
            - $ref: '#/components/schemas/com.hellopublic.trading.core.quote.BondQuoteDetail'
        tradingHalted:
          type: boolean
          description: Indicates if trading is currently halted on the symbol
        uptickRule:
          type: string
          description: |-
            The Uptick Rule is triggered for equities when the price today or yesterday has dropped at least 10 percent since previous days' closing price.
            The property is null when the rule is not applicable (for other security types than equity) or when it cannot be determined.
          enum:
            - TRIGGERED
            - NOT_TRIGGERED
      description: The original version did not allow null values for bid/ask data. This was relaxed later to allow equity to use super-quotes
    com.matadorapp.shared.customerordergateway.dto.StrategyLegDto:
      required:
        - instrument
        - ratioQuantity
        - side
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.StrategyLegInstrumentDto'
        side:
          type: string
          description: Order side for the leg
          enum:
            - BUY
            - SELL
        openCloseIndicator:
          type: string
          description: Open close indicator for the leg. Null for equity leg
          enum:
            - OPEN
            - CLOSE
        ratioQuantity:
          type: integer
          description: Ratio quantity for the leg
          format: int32
        quote:
          $ref: '#/components/schemas/com.hellopublic.trading.core.quote.SignedQuote'
    com.matadorapp.shared.customerordergateway.dto.StrategyLegInstrumentDto:
      required:
        - symbol
      type: object
      properties:
        symbol:
          type: string
          description: Instrument symbol.
        baseSymbol:
          type: string
          description: Base symbol. Only available for option leg.
        type:
          type: string
          description: Type of option. Only available for option leg.
          enum:
            - CALL
            - PUT
        strikePrice:
          type: string
          description: Option strike price. Only available for option leg.
        expirationDate:
          type: string
          description: Option expiration date. Only available for option leg.
          format: date
      description: Defines the leg instrument.
    com.matadorapp.shared.customerordergateway.dto.StrategyQuoteDto:
      required:
        - ask
        - bid
        - price
        - strategyLegs
        - strategyName
      type: object
      properties:
        debitCredit:
          type: string
          description: |-
            Flag to determine if the strategy is a debit or credit strategy. If the price is close to $0.00 or the spread
             is across $0.00, e.g. bid = -$0.10 and ask = $0.20 then UNKNOWN is returned.
          enum:
            - DEBIT
            - CREDIT
            - UNDECIDED
        strategyLegs:
          type: array
          description: Legs and their quotes.
          items:
            $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.StrategyLegDto'
        equityQuote:
          $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.StrategyLegDto'
        price:
          type: string
          description: Strategy price.
        bid:
          type: string
          description: Strategy bid (same value as price).
        ask:
          type: string
          description: Strategy ask.
        mark:
          type: string
          description: Mark price, average of bid/ask
        strategyName:
          type: string
          description: Name of the strategy.
        expirationDate:
          type: string
          description: Strategy expiration date. Null if legs expire on different dates or equity leg is part of strategy.
          format: date
      description: Quote for multileg strategy.
    com.hellopublic.userapigateway.api.rest.marketdata.quote.GatewayQuoteRequest:
      required:
        - instruments
      type: object
      properties:
        instruments:
          type: array

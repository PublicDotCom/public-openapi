          type: string
        change:
          type: string
          nullable: true
        percentChange:
          type: string
          nullable: true
      required:
        - close
        - closeDate
    RegularSessionClosingData:
      type: object
      properties:
        timestamp:
          type: string
        price:
          type: string
          nullable: true
    MarketSessionBars:
      type: object
      properties:
        expectedBars:
          type: integer
        bars:
          type: array
          items:
            $ref: '#/components/schemas/Bar'
      required:
        - expectedBars
        - bars
    BarsResponse:
      type: object
      properties:
        symbol:
          type: string
        period:
          type: string
        totalExpectedBars:
          type: integer
        previousClosePrice:
          type: string
          nullable: true
        totalGainLoss:
          type: string
          nullable: true
        totalGainLossPercentage:
          type: string
          nullable: true
        preMarket:
          $ref: '#/components/schemas/MarketSessionBars'
        regularMarket:
          $ref: '#/components/schemas/MarketSessionBars'
        afterMarket:
          $ref: '#/components/schemas/MarketSessionBars'
        preMarketOvernight:
          $ref: '#/components/schemas/MarketSessionBars'
          description: DAY chart only. Overnight ATS bars 00:00-04:00 ET. Only present when tradingSessionToggle=ALL_SESSIONS. The WEEK chart does not use this field; it merges overnight bars into regularMarket instead.
        postMarketOvernight:
          $ref: '#/components/schemas/MarketSessionBars'
          description: DAY chart only. Overnight ATS bars 20:00-24:00 ET. Only present when tradingSessionToggle=ALL_SESSIONS. The WEEK chart does not use this field; it merges overnight bars into regularMarket instead.
        lastTradingSessionClose:
          $ref: '#/components/schemas/LastSessionClose'
          deprecated: true
        regularSessionClosingData:
          $ref: '#/components/schemas/RegularSessionClosingData'
          deprecated: true
        lastRegularTradingSessionClose:
          $ref: '#/components/schemas/LastSessionClose'
        leadingFill:
          $ref: '#/components/schemas/LeadingFill'
          description: Present only when the first available data point starts after the requested period (e.g. a recently listed asset, or an asset younger than the selected range). Describes a flat, non-scrubbable lead-in the client should draw from the period start to the first real bar. Not emitted for the DAY chart or the ALL / SINCE_PURCHASE periods.
      required:
        - symbol
        - period
        - totalExpectedBars
        - preMarket
        - regularMarket
        - afterMarket
    LeadingFill:
      type: object
      properties:
        startTimestamp:
          type: string
          description: ISO-8601 start of the requested (visible) period — where the flat fill begins.
        endTimestamp:
          type: string
          description: ISO-8601 timestamp of the first real data point — where the flat fill ends. Matches the first bar's timestamp.
        value:
          type: string
          description: The value to draw the flat fill at (equal to the first real data point's value, so the fill meets the series).
        count:
          type: integer
          description: Number of leading grey bars to draw (same meaning for every timeframe). Index-based renderers use this to reserve/offset the leading width.
        includedInTotalExpectedBars:
          type: boolean
          description: 'Whether `count` is already part of `totalExpectedBars`. false (non-DAY): additive — prepend `count` grey bars in front of the real series (total slots = count + totalExpectedBars). true (DAY): a subset of the fixed-session `totalExpectedBars` — the real bars start at index `count` (grey + real + trailing-empty = totalExpectedBars).'
      required:
        - startTimestamp
        - endTimestamp
        - value
        - count
        - includedInTotalExpectedBars
    EventContractChart:
      type: object
      description: Prices/OHLC are in dollars (0.00 to 1.00) for the side the symbol names, so a .N symbol carries the NO prices. The price is the implied probability, so multiply by 100 for cents/percent. Bars start at the first period with a price, so charts in one response can start at different timestamps and are aligned by timestamp, not by index.
      properties:
        symbol:
          type: string
        previousClosePrice:
          type: string
          nullable: true
        currentPrice:
          type: string
          nullable: true
        totalGainLoss:
          type: string
          nullable: true
        totalGainLossPercentage:
          type: string
          nullable: true
        bars:
          type: array
          items:
            $ref: '#/components/schemas/Bar'
    EventContractChartsResponse:
      type: object
      description: A symbol is omitted from charts when it is unknown, has no candles, or has no price in the requested period.
      properties:
        period:
          type: string
        charts:
          type: array
          items:
            $ref: '#/components/schemas/EventContractChart'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the `accessToken` returned by `POST /userapiauthservice/personal/access-tokens`.
info:
  title: User Api Gateway REST API
  version: '1'
openapi: 3.0.1
paths:
  /userapiauthservice/personal/access-tokens:
    post:
      tags:
        - authorization
      summary: Create API Access Token
      description: Generates a new personal Access Token (JWT) with a specified validity in minutes, using an existing personal Secret Token. The personal Secret Token must be generated from the user's settings page. Secret Tokens are long-lived but revocable, while Access Tokens are short-lived and expire after the specified validity period. The Access Token returned from this operation is required for authorization in all other subsequent API requests.
      operationId: create-personal-access-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.userapiauthservice.api.personal.CreateAccessTokenRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapiauthservice.api.personal.CreateAccessTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapiauthservice.domain.error.ErrorBody'
              examples:
                Invalid secret:
                  description: Invalid secret
                  value:
                    errorCode: user_api_auth.personal.invalid_secret
                    message: Invalid secret
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapiauthservice.domain.error.ErrorBody'
              examples:
                Too many requests. Please wait for a few minutes and try again.:
                  description: Too many requests. Please wait for a few minutes and try again.
                  value:
                    errorCode: user_api_auth.personal.too_many_requests
                    message: Too many requests. Please wait for a few minutes and try again.
      security: []
  /userapigateway/trading/account:
    get:
      tags:
        - list-accounts
      summary: Get accounts
      description: |
        Retrieves the list of financial accounts associated with the authenticated user.
        This includes brokerage, retirement, and high-yield cash accounts.

        The response contains account objects that represent each available account.

        Note: The `accountId` returned by this endpoint is required for most subsequent API operations.
        It serves as a stable, persistent identifier for the lifetime of the account.
      operationId: get-accounts
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.account.AccountSettingsResponse'
        '401':
          description: Unauthorized access
  /userapigateway/trading/{accountId}/portfolio/v2:
    get:
      tags:
        - account-details
      summary: Retrieve an account portfolio details snapshot
      description: Retrieves a snapshot of a specified account’s portfolio, including positions, equity breakdown, buying power, and open orders. The account must exist and belong to the authenticated client.
      operationId: get-account-portfolio-v2
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        '200':
          description: Portfolio details successfully retrieved
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.portfolio.GatewayPortfolioAccountV2'
        '404':
          description: Account not found, does not belong to the client, or is of an unsupported type. All account types returned by the accounts endpoint, including BOND_ACCOUNT and TREASURY, are supported.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.portfolio.GatewayPortfolioAccountV2'
  /userapigateway/trading/{accountId}/history:
    get:
      tags:
        - account-details
      summary: Retrieve account history
      description: Fetches a paginated list of historical account events — including trades, money movements, and position adjustments — for the specified account. Supports optional time-range filtering (start/end) and pagination via the nextToken continuation token.
      operationId: get-history
      parameters:
        - name: accountId
          in: path
          description: Target account ID.
          required: true
          schema:
            minLength: 1
            type: string
        - name: start
          in: query
          description: 'Start timestamp in ISO 8601 format with timezone. Example: 2025-01-15T09:00:00-05:00 (9 AM EST, New York time). Formated "YYYY-MM-DDTHH:MM:SSZ"'
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: 'End timestamp in ISO 8601 format with timezone. Example: 2025-04-10T09:00:00-04:00 (9 AM EDT, New York time). Formated "YYYY-MM-DDTHH:MM:SSZ"'
          required: false
          schema:
            type: string
            format: date-time
        - name: pageSize
          in: query
          description: Maximum number of records to return.
          required: false
          schema:
            type: integer
            format: int32
        - name: nextToken
          in: query
          description: Pagination token for fetching the next result set.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: History retrieved successfully.

              - TEN_YEARS
              - ALL
              - YTD
              - SINCE_PURCHASE
        - name: purchaseDate
          in: query
          description: Required for SINCE_PURCHASE. YYYY-MM-DD
          required: false
          schema:
            type: string
            example: '2025-02-24'
        - name: tradingSessionToggle
          in: query
          description: Which sessions to include on the DAY and WEEK equity charts. REGULAR_HOURS = 09:30-16:00 only; REGULAR_AND_EXTENDED_HOURS = 04:00-20:00 (default when omitted); ALL_SESSIONS = adds the overnight ATS sessions. On DAY, ALL_SESSIONS expands to a midnight-midnight axis and adds the separate preMarketOvernight (00:00-04:00) and postMarketOvernight (20:00-24:00) fields. On WEEK, ALL_SESSIONS switches the chart to full 24/5 coverage (extended hours + overnight ATS) merged chronologically into the single continuous regularMarket series (no separate overnight fields); default and REGULAR_HOURS keep the regular-hours-only WEEK chart unchanged. Unknown values fall back to REGULAR_AND_EXTENDED_HOURS.
          required: false
          schema:
            type: string
            enum:
              - REGULAR_HOURS
              - REGULAR_AND_EXTENDED_HOURS
              - ALL_SESSIONS
        - name: ipoDate
          in: query
          description: Optional. The asset's IPO / first-trade date (YYYY-MM-DD). When the asset is younger than the requested period, the backend fetches a finer aggregation over the available post-IPO history (so the chart isn't a straight diagonal) and returns a `leadingFill` object describing the flat lead-in for the pre-IPO portion. When omitted, behavior is unchanged. A future or unparseable value is ignored. Not applied to the DAY chart. See the `leadingFill` schema.
          required: false
          schema:
            type: string
            example: '2026-07-20'
        - name: type
          in: path
          description: Instrument type. Used as a suffix on the symbol internally (EQUITY = no suffix).
          required: true
          schema:
            type: string
            enum:
              - EQUITY
              - CRYPTO
              - OPTION
              - INDEX
              - EVENTCONTRACT
      responses:
        '200':
          description: Successful response with bar data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarsResponse'

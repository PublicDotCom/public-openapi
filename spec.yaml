        bidMinSize:
          type: string
          description: Minimum trade size for bids in par value
        askMarkup:
          type: string
          description: Ask markup percentage
        bidMarkup:
          type: string
          description: Bid markup percentage
        suggestedBuyPrice:
          type: string
          description: Suggested buy price for this bond
        suggestedSellPrice:
          type: string
          description: Suggested sell price for this bond
        minBuyAmount:
          type: string
          description: Minimum buy amount in dollars
        minBuyIncrementAmount:
          type: string
          description: Minimum buy increment amount in dollars
      description: Bond-specific details for a quote.
    com.hellopublic.userapigateway.api.rest.marketdata.quote.GatewayQuote:
      required:
        - instrument
        - outcome
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.GatewayOrderInstrument'
        outcome:
          type: string
          description: The outcome status of the quote request.
          enum:
            - SUCCESS
            - UNKNOWN
        last:
          type: string
          description: The last traded price of the instrument. Can be null if no trades have occurred.
        lastTimestamp:
          type: string
          description: Timestamp of when the last trade occurred. Can be null if no trades have occurred.
          format: date-time
        bid:
          type: string
          description: The current bid price (sell-side price) in the market. Can be null if no bid exists.
        bidSize:
          type: integer
          description: Number of shares, contracts, or units available at the given bid price.
          format: int32
        bidTimestamp:
          type: string
          description: Timestamp of when the bid price was last updated. Can be null if no bid exists.
          format: date-time
        ask:
          type: string
          description: The current ask price (buy-side price) in the market. Can be null if no ask exists.
        askSize:
          type: integer
          description: Number of shares, contracts, or units available at the given ask price.
          format: int32
        askTimestamp:
          type: string
          description: Timestamp of when the ask price was last updated. Can be null if no ask exists.
          format: date-time
        volume:
          type: integer
          description: The total volume traded on the date of the last trade.
          format: int64
        openInterest:
          type: integer
          description: The total number of options contracts that are not closed or delivered on a particular day.
          format: int64
        previousClose:
          type: string
          description: The previous day's close price from the last trading session.
        oneDayChange:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.marketdata.quote.OneDayChange'
        optionDetails:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.marketdata.quote.OptionDetails'
        bondDetails:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.marketdata.quote.BondDetails'
    com.hellopublic.userapigateway.api.rest.marketdata.quote.GatewayQuoteResponse:
      type: object
      properties:
        quotes:
          type: array
          description: List of quotes
          items:
            $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.marketdata.quote.GatewayQuote'
    com.hellopublic.userapigateway.api.rest.marketdata.quote.OneDayChange:
      type: object
      properties:
        change:
          type: string
          description: The one-day price change in dollars
        percentChange:
          type: string
          description: The one-day price change as a percentage
      description: |-
        Represents the one-day price change data for a quote.

        The change values are provided by the data source (e.g., Xignite) and may differ from simple subtraction
        of current price minus previous close due to corporate actions, stock splits, or other adjustments.
    com.hellopublic.userapigateway.api.rest.marketdata.quote.OptionDetails:
      required:
        - strikePrice
      type: object
      properties:
        greeks:
          $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.options.OptionGreeks'
        strikePrice:
          type: string
          description: The strike price for the option contract.
        midPrice:
          type: string
          description: |-
            The mid price (average of bid and ask) for the option contract.
            Null if bid/ask data is not available.
          nullable: true
      description: Option-specific details including Greeks, strike price, and mid price.
    com.hellopublic.userapigateway.api.rest.options.OptionGreeks:
      type: object
      properties:
        delta:
          type: string
          description: |-
            Delta is the theoretical estimate of how much an option's value may change given a $1 move UP or DOWN in the underlying security.
            The Delta values range from -1 to +1, with 0 representing an option where the premium barely moves relative to price changes in the underlying stock.
        gamma:
          type: string
          description: |-
            Gamma represents the rate of change between an option's Delta and the underlying asset's price.
            Higher Gamma values indicate that the Delta could change dramatically with even very small price changes in the underlying stock or fund.
        theta:
          type: string
          description: |-
            Theta represents the rate of change between the option price and time, or time sensitivity—sometimes known as an option's time decay.
            Theta indicates the amount an option's price would decrease as the time to expiration decreases, all else equal.
        vega:
          type: string
          description: Vega measures the amount of increase or decrease in an option premium based on a 1% change in implied volatility.
        rho:
          type: string
          description: Rho represents the rate of change between an option's value and a 1% change in the interest rate. This measures sensitivity to the interest rate.
        impliedVolatility:
          type: string
          description: Implied volatility (IV) is a theoretical forecast of how volatile an underlying stock is expected to be in the future.
    com.hellopublic.userapigateway.api.rest.marketdata.quote.GatewayOptionExpirationsRequest:
      required:

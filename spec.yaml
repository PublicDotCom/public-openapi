  /userapigateway/trading/{accountId}/preflight/single-leg:
    post:
      tags:
        - order-placement
      summary: Calculates the estimated financial impact of a potential trade before execution
      description: Performs preflight calculations for a single-leg order (a transaction involving a single security) to provide comprehensive cost estimates and account impact details. Returns estimated commission, regulatory fees, order value, buying power requirements, margin impact, and other trade-specific information to help users make informed trading decisions before order placement. Note that these are estimates only, and actual execution values may vary depending on market conditions. This endpoint may be called before submitting an actual order to understand the potential financial implications.
      operationId: preflight-single-leg
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.PreflightSingleLegRequest'
        required: true
      responses:
        '200':
          description: Successfully calculated preflight estimates
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.PreflightSingleLegResponse'
        '400':
          description: Invalid request parameters or account validation failure
  /userapigateway/trading/{accountId}/preflight/multi-leg:
    post:
      tags:
        - order-placement
      summary: Calculates the estimated financial impact of a complex multi-leg trade before execution
      description: Performs preflight calculations for a multi-leg order (a transaction involving multiple securities or options strategies such as spreads, straddles, or combinations) to provide comprehensive cost estimates and account impact details. Returns estimated commission, regulatory fees, total order value, buying power requirements, margin impact, net credit/debit amounts, and strategy-specific information to help users make informed trading decisions before order placement. This endpoint handles complex options strategies and calculates the combined effect of all legs in the trade. Note that these are estimates only, and actual execution values may vary depending on market conditions and fill prices. This endpoint may be called before submitting an actual multi-leg order to understand the potential financial implications of the strategy.
      operationId: preflight-multi-leg
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.PreflightMultiLegRequest'
        required: true
      responses:
        '200':
          description: Successfully calculated preflight estimates for a given multi-leg strategy
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.preflight.PreflightMultiLegResponse'
        '400':
          description: Invalid request parameters, unsupported strategy, or account validation failure
  /userapigateway/trading/{accountId}/order:
    post:
      tags:
        - order-placement
      summary: Place a new order
      description: |
        Submits a new order asynchronously for the specified account.

        Bracket orders: set orderClass to BRACKET, OCO, or OTO and supply takeProfit and/or stopLoss. The returned orderId
        identifies the entry order; the exit legs are placed automatically when the entry fills.

        Note: Order placement is asynchronous. The returned result confirms submission, not execution or visibility.
        To retrieve the order status or execution details, query the GET /{orderId} endpoint after submission.
      operationId: place-order
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.ApiOrderRequest'
        required: true
      responses:
        '200':
          description: Order accepted for processing.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.ApiOrderResult'
        '400':
          description: Order validation failed.
    put:
      tags:
        - order-placement
      summary: Cancel-Replace an existing order
      description: |
        Submits a request to replace an existing order asynchronously for the specified account. A replacement lets you modify an open order (for example, its quantity or price) without cancelling and resubmitting it manually.
        Note: Order replacement is asynchronous. This response confirms submission only. To verify the order status or execution details, use the GET /{orderId} endpoint after replacement.
        Supported for equity, option, and crypto quantity orders.
        Bracket orders: the opening (entry) order cannot be replaced. The closing legs (take-profit, stop-loss, and both legs of an OCO) can have their limitPrice and stopPrice replaced; quantity, orderType and expiration must be resubmitted unchanged.
      operationId: replace-order
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.ApiCancelReplaceOrderRequest'
        required: true
      responses:
        '200':
          description: Order replacement accepted for processing.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.ApiOrderResult'
        '400':
          description: Order validation failed.
  /userapigateway/trading/{accountId}/order/search:
    post:
      tags:
        - order-placement
      summary: Search order details
      description: |
        Search order details and status for orders fulfilling defined criteria.

        Retrieve up to 500 orders.
        Works only for orders created within last 30 days.
      operationId: search-orders
      parameters:
        - name: accountId
          in: path

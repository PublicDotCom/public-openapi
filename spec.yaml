            - PMUS
            - CDNA
        resolved:
          type: boolean
          description: whether the event is resolved/inactive or not.
        halted:
          type: boolean
          description: whether trading is halted for all outcomes within the event.
        title:
          type: string
          description: 'the title of the event. Example: "Size of Fed balance sheet at end of 2026".'
        category:
          type: string
          description: 'the category of the event. Example: "Economics".'
        volume:
          type: string

          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.StrategyQuoteDto'
  /userapigateway/eventcontract/summary:
    post:
      tags:
        - event-contracts
      summary: Get Event Summary
      description: Returns a paginated list of event summaries, optionally limited to a category and filtered by eventSymbol or frequency. Each result includes the event's symbol, title, volume and status. Use the returned eventSymbol with Get Event Details to fetch outcomes, contracts and pricing. Results can include resolved and halted events. Up to 100 events are returned per page; to fetch the next page, send the same request with the nextToken from the previous response.
      operationId: get-event-summary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.hellopublic.holdingsystem.eventcontractservice.api.dto.request.userapigateway.EventSummaryUserApiRequestDto'
        required: true
      responses:
        '200':
          description: Event summaries retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.holdingsystem.eventcontractservice.api.dto.response.userapigateway.EventSummaryUserApiListDto'
        '400':
          description: Invalid request body, for example a missing required field.
  /userapigateway/eventcontract/summary/categories:
    get:
      tags:
        - event-contracts
      summary: Get Event Categories
      description: Returns the event categories that can be used to browse event contracts, with each category's subcategories and the frequency filters it supports. Use a returned category value as the category input to Get Event Summary.
      operationId: get-event-categories
      responses:
        '200':
          description: Categories retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.holdingsystem.eventcontractservice.api.dto.response.EventCategoryListDto'
  /userapigateway/eventcontract/details/{eventSymbol}:
    get:
      tags:
        - event-contracts
      summary: Get Event Details
      description: 'Returns full details for a single event: its outcomes, the YES/NO contracts for each outcome with current pricing, the trading timeline, and the CFTC contract terms. The eventSymbol comes from Get Event Summary. Returns 400 with code 7004 if no event matches the eventSymbol.'
      operationId: get-event-details
      parameters:
        - name: eventSymbol
          in: path
          description: The eventSymbol returned by Get Event Summary.
          required: true
          schema:
            type: string
          example: KALSHI.KXBALANCESHEET-EO26
        - name: includeAllOutcomes
          in: query
          description: When true (default), all outcomes are returned. When false, only a short list of up to 8 outcomes is returned.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Event details retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.holdingsystem.eventcontractservice.api.dto.response.userapigateway.EventUserApiDto'
        '400':
          description: No event found for the given eventSymbol (code 7004).

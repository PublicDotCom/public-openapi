  /userapigateway/historicdata/event-contracts/{eventId}/bars/{period}:
    get:
      tags:
        - market-data
      summary: Fetch chart bars for event contracts
      operationId: get-event-contract-bars
      parameters:
        - name: eventId
          in: path
          description: The -EVENT grouping id the requested contracts belong to, used to fetch their current prices and, once the event has stopped trading, its close time
          required: true
          schema:
            type: string
            example: KALSHI.KXBALANCESHEET-EO26-EVENT
        - name: period
          in: path
          description: The time period for the chart. Measured back from now, or from the event's close time once it has stopped trading, so bars never run past the last trade
          required: true
          schema:
            type: string
            enum:
              - DAY
              - WEEK
              - MONTH
              - ALL
        - name: symbols
          in: query
          description: Comma-separated list of up to 8 -EVENTCONTRACT symbols
          required: true
          schema:
            type: string
            example: KALSHI.KXBALANCESHEET-EO26-6.6.Y-EVENTCONTRACT
      responses:
        '200':
          description: Chart bars per requested symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventContractChartsResponse'
        '400':
          description: Invalid symbols, too many symbols, non event contract symbol, an eventId that is not an -EVENT id, or invalid period
        '404':
          description: No data for any requested event contract
        '500':
          description: Internal server error
        '502':
          description: Upstream (Apex) error
  /userapigateway/option-details/{accountId}/strategy-details/quote:
    post:
      tags:
        - option-details
      summary: Get quote for multi-leg option strategy
      description: Get a quote for a multi-leg option strategy including all legs and combined pricing
      operationId: get-strategy-quote
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.matadorapp.shared.customerordergateway.dto.StrategyQuoteRequest'
        required: true
      responses:

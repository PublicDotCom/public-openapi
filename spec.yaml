                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrders'
        '404':
          description: Account not found, does not belong to the client, or is of an unsupported type.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/com.hellopublic.userapigateway.api.rest.order.v2.GatewayOrders'
  /userapigateway/trading/{accountId}/order/multileg:
    post:
      tags:
        - order-placement
      summary: Place a new multi-leg order
      description: |
        Submits a new multi-leg order asynchronously for the specified account.

        Note: Order placement is asynchronous. This response confirms submission only.
        To verify the order status or execution details, use the GET /{orderId} endpoint after placement.
      operationId: place-multileg-order
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
